version: 2

project_name: audible-mcp

before:
  hooks:
    - go mod tidy

builds:
  - id: audible-mcp
    main: ./cmd/audible-mcp
    binary: audible-mcp
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/mfacenet/audible-mcp/internal/version.Version={{.Version}}
      - -X github.com/mfacenet/audible-mcp/internal/version.Commit={{.ShortCommit}}
      - -X github.com/mfacenet/audible-mcp/internal/version.Date={{.Date}}

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

dockers_v2:
  - images:
      - ghcr.io/mfacenet/audible-mcp
    tags:
      - "{{ .Version }}"
      - latest
    dockerfile: Dockerfile
    labels:
      "org.opencontainers.image.source": "https://github.com/mfacenet/audible-mcp"
      "org.opencontainers.image.licenses": "MIT"
      "org.opencontainers.image.title": "audible-mcp"
      "org.opencontainers.image.description": "MCP server for authenticated Audible library reads"
      "io.modelcontextprotocol.server.name": "io.github.mfacenet/audible-mcp"
